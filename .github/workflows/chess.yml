name: Chess Studio

on:
  push:
    branches: [main]
    paths: ['chess/**', '.github/workflows/chess.yml']
  pull_request:
    paths: ['chess/**', '.github/workflows/chess.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chess/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chess/dist

  # Publishes the app to GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions"
  # (and, on the free plan, a public repository).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
